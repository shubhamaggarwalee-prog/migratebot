# .github/workflows/secret-scan.yml
# Gap 10 — Secret / credential scanning on every PR
#
# Uses Gitleaks to block PRs that accidentally commit API keys,
# tokens, passwords, or other secrets.
#
# Scans only the diff introduced by the PR (not the full history)
# to keep runs fast.

name: Secret Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gitleaks:
    name: Gitleaks — Detect Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history needed for accurate diff scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Gitleaks exits non-zero if secrets are found — fails the check.
        # To allowlist a false-positive, add a .gitleaks.toml at the repo root.
