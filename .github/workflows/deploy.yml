# .github/workflows/deploy.yml
# Gap 10 — Continuous Deployment
#
# Triggers ONLY on push to main (i.e. after a PR is merged).
# Requires CI to pass first (needs: [lint-and-build, test-backend] via
# reusable workflow pattern — deploy runs in sequence after ci.yml succeeds
# because GitHub resolves workflow dependencies through branch protection rules).
#
# Deployment targets:
#   frontend  — Vercel (via Vercel CLI)
#   backend   — Railway (via Railway CLI)
#
# Required GitHub Secrets:
#   VERCEL_TOKEN          — Vercel personal access token
#   VERCEL_ORG_ID         — Vercel team/org ID
#   VERCEL_PROJECT_ID     — Vercel project ID
#   RAILWAY_TOKEN         — Railway API token
#   RAILWAY_SERVICE_ID    — Railway service ID for backend
#   SLACK_DEPLOY_WEBHOOK  — (optional) Slack webhook for deploy notifications

name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false   # Never cancel an in-flight production deploy

jobs:
  # ───────────────────────────────────────────────────────
  # Job 1: Deploy frontend to Vercel
  # ───────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel production
        id: vercel-deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deployment_url=$url" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment deployment URL on commit
        uses: actions/github-script@v7
        with:
          script: |
            const sha  = context.sha.slice(0, 7);
            const url  = '${{ steps.vercel-deploy.outputs.deployment_url }}';
            await github.rest.repos.createCommitComment({
              owner:      context.repo.owner,
              repo:       context.repo.repo,
              commit_sha: context.sha,
              body:       `✅ Frontend deployed to production\n\n🔗 ${url}\n🔖 Commit: \`${sha}\``,
            });

  # ───────────────────────────────────────────────────────
  # Job 2: Deploy backend to Railway
  # ───────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Railway
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy to Railway
        id: railway-deploy
        run: |
          railway up \
            --service ${{ secrets.RAILWAY_SERVICE_ID }} \
            --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ───────────────────────────────────────────────────────
  # Job 3: Post-deploy Slack notification
  # Runs after BOTH deploys finish (success or failure)
  # ───────────────────────────────────────────────────────
  notify:
    name: Slack Deploy Notification
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    if: always() && secrets.SLACK_DEPLOY_WEBHOOK != ''

    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "${{ needs.deploy-frontend.result == 'success' && needs.deploy-backend.result == 'success' && '✅ MigrateBot deployed to production' || '❌ MigrateBot deploy failed' }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*${{ needs.deploy-frontend.result == 'success' && needs.deploy-backend.result == 'success' && '✅ Production deploy succeeded' || '❌ Production deploy failed' }}*\n>Commit: <${{ github.event.head_commit.url }}|`${{ github.sha }}`>\n>Author: ${{ github.event.head_commit.author.name }}\n>Message: ${{ github.event.head_commit.message }}\n>Frontend: `${{ needs.deploy-frontend.result }}`  |  Backend: `${{ needs.deploy-backend.result }}`"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL:  ${{ secrets.SLACK_DEPLOY_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
